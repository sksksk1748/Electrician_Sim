<title>配線道場</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="從零開始學配線、用電安全、三用電表與故障查修，目標室內配線丙級。">
<script>
  /* 在畫面繪製前套用記住的背景設定，避免閃一下 */
  try {
    var savedTheme = localStorage.getItem('peixian-dojo-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-app-theme', savedTheme);
  } catch (e) {}
</script>

<header class="topbar">

      <rect x="12.5" y="8.5" width="7" height="8" rx="1.5" fill="#FAFAF6"/>
    </svg>
    <span class="brand-name">配線道場</span>
  </a>
  <div class="topbar-right">

        <span class="ts-lbl">系統</span>

      <button type="button" data-theme-opt="dark" aria-pressed="false" aria-label="深色" title="深色背景">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.4A6.6 6.6 0 0 1 7.6 4a6.6 6.6 0 1 0 8.4 8.4z"/></svg>
        <span class="ts-lbl">深色</span>
      </button>

  </div>
